[project]
name = "midison"
version = "0.6.0"
description = "Voice-led MIDI chord progressions, songs and grooves for your DAW, as an MCP server and CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Ryan" }]
requires-python = ">=3.11"
keywords = [
    "midi",
    "mcp",
    "music",
    "chords",
    "harmony",
    "voice-leading",
    "ableton",
    "songwriting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3.0",
    "mcp>=2.3,<3",
    "jsonschema>=4.20",
    "python-rtmidi>=1.5.0",
    "python-osc>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/ddri/midison"
Repository = "https://github.com/ddri/midison"
Issues = "https://github.com/ddri/midison/issues"
Changelog = "https://github.com/ddri/midison/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
midison = "midison.cli:main"
midison-corpus = "midison.corpus:main"
midison-mcp = "midison.mcp_server:main"
banjo = "midison.cli:main"
banjo-corpus = "midison.corpus:main"
banjo-mcp = "midison.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midison"]

[tool.hatch.build.targets.sdist]
# An explicit list: .gitignore re-includes docs/**/*.md, which would otherwise
# ship internal planning notes in the published archive.
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Catching Exception in top-level CLI error reporting and socket/stream fallback
    "TRY004",  # User-facing payload validation raises ValueError
]

