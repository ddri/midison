[project]
name = "midison"
version = "0.4.0"
description = "MIDI chord progression generator as an MCP Server."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.0",
    "mcp>=1.0",
    "python-rtmidi>=1.5.0",
    "python-osc>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
midison = "midison.cli:main"
midison-corpus = "midison.corpus:main"
midison-mcp = "midison.mcp_server:main"
banjo = "midison.cli:main"
banjo-corpus = "midison.corpus:main"
banjo-mcp = "midison.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midison"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Catching Exception in top-level CLI error reporting and socket/stream fallback
    "TRY004",  # User-facing payload validation raises ValueError
]

